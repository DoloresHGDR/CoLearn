services:

  # Base de datos PostgreSQL
  db:
    image: postgres:15
    container_name: colearn_db
    # Usuario, contraseña y nombre de la base salen del .env de esta carpeta (ver .env.example)
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
    # Solo accesible desde la propia máquina: en la nube la base no queda abierta a internet
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend FastAPI
  api:
    build: ./backend
    container_name: colearn_api
    ports:
      - "8800:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data
      # Caché de modelos de HuggingFace: evita volver a descargar el modelo en cada rebuild
      - huggingface_cache:/root/.cache

volumes:
  postgres_data:
  huggingface_cache:
